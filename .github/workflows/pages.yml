name: pages

# Pubblica su GitHub Pages la versione senza server: motore e bot girano nel
# browser, e le partite passano da browser a browser via WebRTC.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Di base solo lettura: la scrittura su Pages serve ai job che la usano.
permissions:
  contents: read

# Un deploy alla volta, senza annullare quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: assembla il sito
        env:
          # Variabili del repo (Settings → Secrets and variables → Actions →
          # Variables). Senza nessuna delle due, il gioco va solo fra browser
          # sulla stessa rete. TURN_ICE_SERVERS ha la precedenza: e' l'elenco
          # gia' pronto di un piano gratuito, zero richieste in piu' a runtime.
          TRANS_TURN_ICE: ${{ vars.TURN_ICE_SERVERS }}
          TRANS_TURN_URL: ${{ vars.TURN_CREDENTIALS_URL }}
          # Un broker PeerJS proprio (https://...), al posto di quello pubblico.
          # Si imposta qui e non nell'indirizzo: un ?broker= in un link darebbe a
          # chiunque il modo di portare chi lo apre su un falso tavolo.
          TRANS_BROKER: ${{ vars.BROKER_URL }}
        run: python site/build.py
      # Niente enablement qui. Creando il sito da solo lo faceva nascere in
      # modalita' "Deploy from a branch", dove GitHub passa il repo dentro
      # Jekyll e ignora l'artefatto di questo workflow. La sorgente si mette su
      # "GitHub Actions" nelle impostazioni del repo, una volta sola.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write   # solo questo job: serve a deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

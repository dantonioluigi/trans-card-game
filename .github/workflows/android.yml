name: android

# Costruisce l'app Android e la lascia fra gli artefatti dell'esecuzione
# (Actions → l'esecuzione → Artifacts). Sui tag vX.Y.Z la chiama release.yml, che
# la allega alla Release.
#
# Senza segreti esce un APK di debug (firmato con la chiave di debug pubblica del
# repo). Con questi quattro segreti del repo esce invece una build di rilascio
# firmata con la tua chiave, APK piu' AAB per Play:
#   ANDROID_KEYSTORE_BASE64     il file .jks/.keystore, in base64 (base64 -w0 file)
#   ANDROID_KEYSTORE_PASSWORD   la password del keystore
#   ANDROID_KEY_ALIAS           l'alias della chiave
#   ANDROID_KEY_PASSWORD        la password della chiave
# Le PR da fork non ricevono i segreti: lì esce sempre il debug.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "site/**"
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "web/**"
      - "site/**"
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: versione
        id: version
        run: |
          # Sui tag il numero di versione e' quello del tag e il VERSION_CODE se ne
          # ricava: piccolo e crescente con la versione, come Play lo vuole (il tetto
          # e' 2,1 miliardi: con l'ora in secondi, ~1,8 miliardi, Play avvisa).
          #   X.Y.Z-rcN -> X*1000000 + Y*10000 + Z*100 + N
          #   X.Y.Z     -> X*1000000 + Y*10000 + Z*100 + 99   (la finale supera ogni rc)
          # Un build rifatto dallo stesso tag ha lo stesso codice, e Play lo rifiuta:
          # per una build nuova serve un tag nuovo (rc2, rc3...).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            re='^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc([0-9]+))?$'
            if ! [[ "$name" =~ $re ]]; then
              echo "::error::il tag deve essere vX.Y.Z o vX.Y.Z-rcN, non '$GITHUB_REF_NAME'"
              exit 1
            fi
            major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
            # La finale prende 99: un rc non puo' arrivare a 99, o avrebbe lo stesso codice.
            if [ -n "${BASH_REMATCH[5]}" ]; then stage=$((10#${BASH_REMATCH[5]})); else stage=99; fi
            if [ "$major" -gt 2000 ] || [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ] || [ "$stage" -lt 1 ] || [ "$stage" -gt 99 ] \
               || { [ -n "${BASH_REMATCH[5]}" ] && [ "$stage" -gt 98 ]; }; then
              echo "::error::versione fuori dai limiti del codice (major<=2000, minor e patch<=99, rc 1-98): '$name'"
              exit 1
            fi
            code=$(( major * 1000000 + minor * 10000 + patch * 100 + stage ))
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            code="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: chiave di firma (solo se i segreti ci sono)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Build di rilascio firmata."
          else
            echo "Nessuna chiave di firma: build di debug."
          fi

      - name: costruisci l'app
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Le stesse variabili di pages.yml: senza relay, da 4G l'app non
          # riesce a collegarsi a chi e' su un'altra rete. Finiscono nell'app,
          # come finiscono nella pagina pubblica.
          TRANS_TURN_ICE: ${{ vars.TURN_ICE_SERVERS }}
          TRANS_TURN_URL: ${{ vars.TURN_CREDENTIALS_URL }}
          TRANS_BROKER: ${{ vars.BROKER_URL }}
        run: bash app/build.sh

      - name: togli la chiave dal disco
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: |
            app/dichiaro-*.apk
            app/dichiaro-*.aab
          if-no-files-found: error

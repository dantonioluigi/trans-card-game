name: release

# Parte da sola quando pushi un tag vX.Y.Z.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-release: v1.0.0-rc1

# Di base nessun permesso di scrittura: ogni job chiede solo quello che usa.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Il nome del tag arriva da fuori e finisce in comandi, nomi di file e tag
  # delle immagini: il glob qui sopra lascia passare qualsiasi carattere dopo il
  # trattino. Prima di tutto si controlla che abbia la forma di una versione.
  tag:
    name: controllo del tag
    runs-on: ubuntu-latest
    steps:
      - name: il tag e' una versione
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::il tag '$GITHUB_REF_NAME' non e' una versione (vX.Y.Z o vX.Y.Z-rcN)"
            exit 1
          fi

  # image e chart non dipendono l'uno dall'altro: partono insieme.
  image:
    name: immagine docker
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # per pubblicare l'immagine su GHCR
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: login su ghcr
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag e label
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: build e push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: helm chart
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # per pubblicare il chart su GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      - name: versione dal tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: allinea Chart.yaml al tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" helm/trans-card-game/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" helm/trans-card-game/Chart.yaml
          grep -E "^(version|appVersion):" helm/trans-card-game/Chart.yaml

      - run: helm lint helm/trans-card-game

      - name: package
        run: helm package helm/trans-card-game --destination dist/

      # Token e nome utente passano da variabili d'ambiente, non scritti nel comando.
      - name: login su ghcr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "$GH_ACTOR" --password-stdin

      - name: push del chart come artefatto OCI
        env:
          VERSION: ${{ steps.version.outputs.value }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm push "dist/trans-card-game-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  # Anche questo parte insieme agli altri: e' il workflow android.yml, lo stesso
  # che gira sui push, richiamato per costruire l'app del tag. I segreti della
  # firma (se li hai impostati) gli passano in eredita'.
  apk:
    name: app android
    needs: tag
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
    secrets: inherit

  release:
    name: github release
    needs: [image, chart, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # per creare la Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-chart
          path: dist/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist/

      - name: versione dal tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: crea la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tgz
            dist/*.apk
            dist/*.aab
          body: |
            ## Come si usa

            Android: scarica l'`.apk` qui sotto e aprilo sul telefono (Android chiede di
            consentire l'installazione da questa fonte). Se la Release contiene anche il
            `.aab`, e' quello da caricare su Google Play.

            Immagine:

            ```bash
            docker run --rm -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Chart:

            ```bash
            helm install trans oci://ghcr.io/${{ github.repository_owner }}/charts/trans-card-game \
              --version ${{ steps.version.outputs.value }}
            ```

# Render — Blueprint. Dalla dashboard: New → Blueprint → punta a questo repo.
#
# Sul piano free il servizio si addormenta dopo un quarto d'ora senza traffico
# e la prima richiesta dopo il risveglio ci mette una trentina di secondi: le
# partite in corso non sopravvivono. Va benissimo per far provare il gioco,
# meno per una serata organizzata.
services:
  - type: web
    name: trans-card-game
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TRANS_LOG_LEVEL
        value: info

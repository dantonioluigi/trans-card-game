name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # I tre job girano in parallelo: nessuno dipende dagli altri.
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: partite di prova fra bot
        run: python -m trans.simulate --games 20

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2
      - run: helm lint helm/trans-card-game
      - name: il chart deve renderizzare anche con l'ingress acceso
        run: |
          helm template trans helm/trans-card-game > /dev/null
          helm template trans helm/trans-card-game \
            --set ingress.enabled=true \
            --set podDisruptionBudget.enabled=true > /dev/null

  web:
    name: client e motore JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: sintassi del client
        run: node --check web/app.js

      - name: le partite registrate sono ancora quelle che il Python produce
        # Se qualcuno cambia le regole in trans/ senza rigenerare le partite di
        # riferimento, qui si vede subito: il motore JS starebbe verificando
        # regole vecchie.
        run: |
          python site/tests/make_fixtures.py
          git diff --exit-code site/tests/fixtures.json

      - name: il motore JS da' gli stessi risultati di quello Python
        run: node site/tests/run.mjs

      - name: l'arbitro peer-to-peer regge una partita intera
        run: node site/tests/table.mjs

      - name: i limiti dell'host e i parametri di prova nell'indirizzo
        run: |
          node site/tests/limits.mjs
          node site/tests/params.mjs
          node site/tests/host.mjs

      - name: le frasi dei motori da tradurre sono quelle registrate
        # Le scrivono i motori e la rete in italiano; il client le traduce con
        # una tabella (web/i18n.js). Se cambi una frase, rigenera l'elenco.
        run: |
          python site/tests/make_messages.py
          git diff --exit-code site/tests/messages.json

      - name: le due lingue (dizionario, chiavi usate, ogni frase tradotta)
        run: node site/tests/i18n.mjs

      - name: l'interfaccia mostra i pannelli giusti, l'ultima presa e l'avviso di aggiornamento solo dove serve
        run: node site/tests/app.mjs

      - name: il sito statico si assembla
        run: python site/build.py

      - name: e anche nella variante per l'app Android
        run: python site/build.py --app

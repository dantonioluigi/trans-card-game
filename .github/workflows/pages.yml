name: pages

# Pubblica su GitHub Pages la versione senza server: motore e bot girano nel
# browser, e le partite passano da browser a browser via WebRTC.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta, senza annullare quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assembla il sito
        run: python site/build.py
      - uses: actions/configure-pages@v5
        # Alla prima esecuzione Pages sul repo non esiste ancora e questo passo
        # fallirebbe: enablement lo fa creare al workflow, senza passare dalle
        # impostazioni a mano.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
